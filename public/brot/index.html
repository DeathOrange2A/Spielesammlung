<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brotkarte Hannover</title>
<meta name="description" content="Gemeinsame Karte für Hannovers Bäckereien: Brote eintragen und pur sowie getoastet bewerten.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brotkarte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- Anmeldung / Einrichtung -->
  <div class="gate gutter" id="gate" hidden><div class="gate-card" id="gateCard"></div></div>

  <!-- Hauptansicht -->
  <header class="top gutter" id="top" hidden>
    <div class="brand"><h1>Brotkarte Hannover</h1><small id="sub">Bäckereien · Brote · Toast-Test</small></div>
    <div class="top-r">
      <span class="offline" id="offline" hidden>offline</span>
      <div class="scale" role="group" aria-label="Bewertungsskala">
        <button id="sc10" type="button" aria-pressed="true">1–10</button>
        <button id="sc5" type="button" aria-pressed="false">★ 1–5</button>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="main" hidden>
    <section class="view" id="mapview">
      <div id="map" aria-label="Karte"></div>
      <div class="map-tools">
        <button class="map-btn" id="addBakery" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M12 7v5M9.5 9.5h5"/></svg>Bäckerei</button>
        <div class="stack">
          <button type="button" id="zin" aria-label="Hineinzoomen">+</button>
          <button type="button" id="zout" aria-label="Herauszoomen">−</button>
        </div>
        <div class="stack">
          <button type="button" id="locate" aria-label="Mein Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
          <button type="button" id="osmToggle" aria-pressed="true" aria-label="Alle Bäckereien aus OpenStreetMap zeigen" title="Alle Bäckereien aus OpenStreetMap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="8" r="2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="16" r="2"/><circle cx="18" cy="16" r="2"/></svg></button>
        </div>
      </div>
      <div class="banner" id="placeBanner" hidden><span id="placeText">Tippe auf die Karte, wo die Bäckerei ist</span><button type="button" id="placeCancel">Abbrechen</button></div>
      <div class="map-card" id="mapEmpty" hidden><b>Noch keine Bäckerei bewertet</b>Die hellen Punkte sind Bäckereien aus OpenStreetMap. Tippe einen an, um dort ein Brot einzutragen, oder setze mit „Bäckerei“ einen eigenen Pin.</div>
      <div class="map-note" id="mapNote" hidden></div>
    </section>
    <section class="view" id="list" hidden>
      <div class="list-inner gutter" id="listInner"></div>
    </section>
  </main>
  <nav class="tabs gutter" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" id="tabMap" aria-selected="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Karte</button>
    <button class="fab" id="addBread" type="button" aria-label="Brot eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" role="tab" id="tabList" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 10.5C5 7.5 8 5.5 12 5.5s7 2 7 5c0 1.2-.8 1.9-1.5 2.2V18a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-5.3C5.8 12.4 5 11.7 5 10.5z"/></svg>Brote</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast-msg" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/leaflet-1.9.4.js"></script>
<script src="vendor/supabase-2.117.3.js"></script>
<script src="app.js"></script>
</body>
</html>
